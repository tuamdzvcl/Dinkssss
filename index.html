<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Overnight Coffee - Đặt hàng online</title>
  <meta name="description" content="Đặt đồ uống online tại Overnight Coffee. Thức uống ngon - Ngày thêm trọn vẹn. Menu phong phú, giao hàng tận nơi.">
  <meta name="theme-color" content="#1a472a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50:  '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#1a5c2e',
              800: '#166534',
              900: '#14532d',
              950: '#1a472a',
            },
            cream:  '#faf6ee',
            'cream-dark': '#f0ead8',
            coffee: {
              light: '#a0826d',
              DEFAULT: '#6b4226',
              dark: '#3e2723',
            },
            gold: '#c8a951',
          },
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            body: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-cream font-body text-gray-800 min-h-screen">

  <!-- ═══════════════════════════════════════ -->
  <!-- HEADER                                  -->
  <!-- ═══════════════════════════════════════ -->
  <header class="relative overflow-hidden bg-gradient-to-br from-primary-950 via-primary-700 to-primary-800 text-white header-pattern">
    <div class="max-w-lg mx-auto px-5 py-8 text-center relative z-10">
      <!-- Logo / Brand -->
      <div class="mb-3">
        <h1 class="font-display text-4xl font-bold tracking-wide leading-tight">
          OVERNIGHT
        </h1>
        <p class="font-display text-xl font-medium text-primary-200 -mt-1 italic">Coffee</p>
      </div>

      <!-- Slogan -->
      <p class="text-primary-100 text-sm font-medium mb-5 tracking-wide">
        Thức uống ngon — Ngày thêm trọn vẹn
      </p>

      <!-- Badges -->
      <div class="flex items-center justify-center gap-4 text-xs text-primary-200">
        <span class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>
          Nguyên liệu tươi sạch
        </span>
        <span class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>
          Ngon chuẩn vị
        </span>
      </div>
    </div>

    <!-- Decorative circles -->
    <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-white/5"></div>
    <div class="absolute -bottom-6 -left-6 w-28 h-28 rounded-full bg-white/5"></div>
  </header>

  <!-- ═══════════════════════════════════════ -->
  <!-- SEARCH BAR                              -->
  <!-- ═══════════════════════════════════════ -->
  <div class="sticky top-0 z-30 bg-cream/95 backdrop-blur-md border-b border-cream-dark/50">
    <div class="max-w-lg mx-auto px-4 py-3">
      <div class="search-wrapper">
        <input
          type="text"
          id="search-input"
          placeholder="Tìm món..."
          class="w-full pl-11 pr-4 py-2.5 bg-white rounded-xl border border-gray-200 text-sm
                 focus:outline-none focus:border-primary-700 focus:ring-2 focus:ring-primary-700/10
                 transition-all placeholder:text-gray-400"
          oninput="handleSearch(this.value)"
        >
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </span>
      </div>
    </div>

    <!-- CATEGORY NAV -->
    <nav id="category-nav"
         class="category-nav hide-scrollbar flex gap-2 overflow-x-auto px-4 pb-3 -mt-0.5">
      <!-- Rendered by JS -->
    </nav>
  </div>

  <!-- ═══════════════════════════════════════ -->
  <!-- MENU CONTAINER                          -->
  <!-- ═══════════════════════════════════════ -->
  <main id="menu-container" class="max-w-lg mx-auto px-4 pt-4 pb-28">
    <!-- Rendered by JS -->
  </main>

  <!-- ═══════════════════════════════════════ -->
  <!-- FLOATING CART BAR                       -->
  <!-- ═══════════════════════════════════════ -->
  <div id="floating-cart" class="floating-cart" onclick="openCartModal()">
    <div class="floating-cart-inner">
      <div class="flex items-center gap-3">
        <div class="relative">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/>
            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
          </svg>
          <span id="cart-badge" class="absolute -top-2 -right-2 bg-gold text-primary-950 text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center">
            0
          </span>
        </div>
        <div>
          <span id="cart-count-text" class="text-white text-sm font-semibold">0 món</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="cart-total-text" class="text-white font-bold text-lg">0đ</span>
        <span class="bg-white text-primary-700 text-xs font-bold px-3 py-1.5 rounded-lg">
          XEM GIỎ
        </span>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ -->
  <!-- MODAL BACKDROP                          -->
  <!-- ═══════════════════════════════════════ -->
  <div id="modal-backdrop" class="modal-backdrop" onclick="closeAllModals()"></div>

  <!-- ═══════════════════════════════════════ -->
  <!-- CART BOTTOM SHEET                       -->
  <!-- ═══════════════════════════════════════ -->
  <div id="cart-modal" class="bottom-sheet bg-white">
    <div class="bottom-sheet-handle"></div>
    
    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-3 border-b border-gray-100">
      <h2 class="text-lg font-bold text-primary-950">🛒 Giỏ hàng</h2>
      <button onclick="closeCartModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Cart Items -->
    <div id="cart-items-container" class="bottom-sheet-body px-5">
      <!-- Rendered by JS -->
    </div>

    <!-- Cart Footer -->
    <div id="cart-footer" class="border-t border-gray-100 px-5 py-4 bg-white">
      <div class="flex items-center justify-between mb-3">
        <span class="text-gray-500 text-sm">Tạm tính</span>
        <span id="cart-modal-total" class="text-xl font-bold text-primary-950">0đ</span>
      </div>
      <button id="btn-checkout" onclick="openCheckoutForm()"
              class="w-full py-3.5 bg-primary-700 text-white font-bold rounded-xl text-[15px]
                     hover:bg-primary-800 active:scale-[0.98] transition-all
                     disabled:opacity-50 disabled:cursor-not-allowed">
        TIẾN HÀNH ĐẶT HÀNG
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ -->
  <!-- CHECKOUT FORM BOTTOM SHEET              -->
  <!-- ═══════════════════════════════════════ -->
  <div id="checkout-modal" class="bottom-sheet bg-white">
    <div class="bottom-sheet-handle"></div>

    <div class="flex items-center justify-between px-5 py-3 border-b border-gray-100">
      <button onclick="backToCart()" class="flex items-center gap-1 text-sm text-primary-700 font-semibold">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
        Quay lại
      </button>
      <h2 class="text-lg font-bold text-primary-950">📋 Thông tin</h2>
      <button onclick="closeCheckoutModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="bottom-sheet-body px-5 py-4">
      <form id="checkout-form" onsubmit="return false;">
        <!-- Họ tên -->
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">
            Họ tên <span class="text-red-500">*</span>
          </label>
          <input type="text" id="input-name" class="form-input" placeholder="Nhập họ tên của bạn" autocomplete="name">
          <p id="error-name" class="text-red-500 text-xs mt-1 hidden">Vui lòng nhập họ tên</p>
        </div>



        <!-- Ghi chú -->
        <div class="mb-5">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Ghi chú</label>
          <textarea id="input-note" class="form-input resize-none" rows="2" placeholder="Ít đường, nhiều đá..."></textarea>
        </div>

        <button type="button" onclick="openOrderSummary()"
                class="w-full py-3.5 bg-primary-700 text-white font-bold rounded-xl text-[15px]
                       hover:bg-primary-800 active:scale-[0.98] transition-all">
          XEM TÓM TẮT ĐƠN HÀNG
        </button>
      </form>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ -->
  <!-- ORDER SUMMARY BOTTOM SHEET              -->
  <!-- ═══════════════════════════════════════ -->
  <div id="summary-modal" class="bottom-sheet bg-white">
    <div class="bottom-sheet-handle"></div>

    <div class="flex items-center justify-between px-5 py-3 border-b border-gray-100">
      <button onclick="backToCheckout()" class="flex items-center gap-1 text-sm text-primary-700 font-semibold">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
        Quay lại
      </button>
      <h2 class="text-lg font-bold text-primary-950">📝 Tóm tắt</h2>
      <div class="w-8"></div>
    </div>

    <div id="summary-content" class="bottom-sheet-body px-5 py-4">
      <!-- Rendered by JS -->
    </div>

    <div class="border-t border-gray-100 px-5 py-4 bg-white">
      <button id="btn-submit-order" onclick="submitOrder()"
              class="w-full py-4 bg-primary-700 text-white font-bold rounded-xl text-base
                     hover:bg-primary-800 active:scale-[0.98] transition-all flex items-center justify-center gap-2
                     disabled:opacity-60 disabled:cursor-not-allowed">
        <span id="submit-text">✅ XÁC NHẬN ĐẶT HÀNG</span>
        <span id="submit-spinner" class="spinner hidden"></span>
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ -->
  <!-- SUCCESS MODAL                           -->
  <!-- ═══════════════════════════════════════ -->
  <div id="success-modal" class="fixed inset-0 z-[60] flex items-center justify-center p-6 hidden">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-3xl p-8 max-w-sm w-full text-center animate-bounce-in shadow-2xl">
      <div class="text-6xl mb-4">🎉</div>
      <h3 class="text-2xl font-bold text-primary-950 mb-2">Đặt hàng thành công!</h3>
      <p class="text-gray-500 text-sm mb-2">Mã đơn hàng của bạn:</p>
      <p id="success-order-id" class="text-lg font-bold text-primary-700 bg-primary-50 py-2 px-4 rounded-xl mb-4 inline-block">
        ---
      </p>
      <p class="text-gray-500 text-sm mb-6">
        Cảm ơn bạn đã đặt hàng tại<br>
        <span class="font-semibold text-primary-950">Overnight Coffee</span> ☕
      </p>
      <button onclick="resetAndNewOrder()"
              class="w-full py-3.5 bg-primary-700 text-white font-bold rounded-xl
                     hover:bg-primary-800 active:scale-[0.98] transition-all">
        🛒 ĐẶT ĐƠN MỚI
      </button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ -->
  <!-- TOAST NOTIFICATION                      -->
  <!-- ═══════════════════════════════════════ -->
  <div id="toast" class="toast"></div>

  <!-- ═══════════════════════════════════════ -->
  <!-- SCRIPTS                                 -->
  <!-- ═══════════════════════════════════════ -->
  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
